[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kawa"
version = "0.1.0"
description = "Kawa — event-sourced continuity substrate (Phase 0 dogfood implementation)"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "psycopg[binary]>=3.1", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest", "mypy", "bandit>=1.8", "pip-audit>=2.8"]
# step 11B: only the indexer and textual live queries need the model runtime —
# core retrieval (anchored vector = stored embeddings) stays dependency-free
embed = ["fastembed>=0.8"]

[tool.setuptools.packages.find]
include = ["kawa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Schema-first Python discipline (#57 §6): strict, fail-loud, no dict[str, Any] across Core.
[tool.mypy]
strict = true
disallow_any_explicit = true
warn_unreachable = true

# SAST mechanical security scanning configuration
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B608"]  # psycopg parameterized %s placeholders throughout (no string-built SQL); B608 false-positives on them

