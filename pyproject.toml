[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kawa"
version = "0.1.0"
description = "Kawa — event-sourced continuity substrate (Phase 0 dogfood implementation)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[tool.setuptools.packages.find]
include = ["kawa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Schema-first Python discipline (#57 §6): strict, fail-loud, no dict[str, Any] across Core.
[tool.mypy]
strict = true
disallow_any_explicit = true
warn_unreachable = true
