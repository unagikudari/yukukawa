name: drift-check

# Structurally enforces Theme E (silent vocabulary / document-set drift) using
# registry/vocabulary.json as the single source of truth. Fails on any NEW drift;
# pre-existing known drift is tracked in registry/drift-baseline.json. See issue #34.
#
# STAGED, not active: lives in ci/ — GitHub Actions only executes
# .github/workflows/. security-check.yml has carried this banner from the
# start; this file did not, and on 2026-08-20 that omission was read as
# "CI runs this" and written into a commit message, a test docstring and an
# operator report. A staging convention only one of its members declares is
# not a convention. Until activation the gate runs locally, and
# tests/test_publication_lint.py runs it in the suite on every change.

on:
  pull_request:
    paths:
      - "docs/**"
      - "registry/**"
      - "README.md"
      - "scripts/lint_vocabulary_drift.py"
      - "scripts/lint_publication_boundary.py"
      - "registry/publication-baseline.json"
      - ".github/workflows/drift-check.yml"
      # the HLC-ordering lint guards CODE, so it must be triggered by code —
      # a lint wired to a path filter that excludes what it lints is not a
      # mechanism, it is a mechanism-shaped file (#214 step 1)
      - "kawa/**"
      - "scripts/**"
      - "tests/**"
  push:
    branches: [main, "agent/**", "spec/**"]

jobs:
  vocabulary-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vocabulary & document-drift lint
        run: python3 scripts/lint_vocabulary_drift.py
      - name: publication-boundary lint (#152 gate-1)
        run: python3 scripts/lint_publication_boundary.py
      - name: HLC-ordering lint (#214 step 1)
        run: python3 scripts/lint_hlc_order.py
